name: Build and publish Cloudflare preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/cloudflare-preparation'
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: node scripts/cloudflare/stage.mjs preview
      - run: node scripts/cloudflare/check-cloudflare.mjs preview
      - name: Deploy only the noindex preview
        run: node scripts/cloudflare/run-wrangler.mjs deploy --config wrangler-preview.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
