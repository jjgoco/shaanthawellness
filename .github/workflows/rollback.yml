name: Restore published static baseline
on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Explicitly approve restoring the published ea29600 baseline'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main' && inputs.approved
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ea296005b9c9add8991d1f6e4b421185628e98f1
          path: legacy-site
      - name: Upload the fixed baseline
        uses: actions/upload-pages-artifact@v5
        with:
          path: legacy-site
          include-hidden-files: true
      - name: Restore Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
